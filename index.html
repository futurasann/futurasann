<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tedy Sanjaya — Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --radius-lg: 26px;
  --border-w: 3px;
  --ease: cubic-bezier(.22,1,.36,1);

  --bg: #F6F6FC;
  --bg-alt: #ECEBFA;
  --card: #FFFFFF;
  --primary: #2E2F7A;
  --secondary: #5B5FCF;
  --accent: #A3A8F7;
  --text: #1E1F3A;
  --text-soft: #55588A;
  --border: #2E2F7A;
  --shadow-color: 46, 47, 122;
  --on-primary: #FFFFFF;
}
html.dark{
  --bg: #0D0E1E;
  --bg-alt: #13152C;
  --card: #181A36;
  --primary: #8489FF;
  --secondary: #9EA1FF;
  --accent: #B6B9FF;
  --text: #F2F2FC;
  --text-soft: #AEB1DE;
  --border: #43467A;
  --shadow-color: 0, 0, 0;
  --on-primary: #0D0E1E;
}

*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:'Plus Jakarta Sans', sans-serif;
  transition:background .5s var(--ease), color .5s var(--ease);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; position:relative;
}
@media(prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}

.bg-dots{
  position:absolute; inset:0; z-index:0; pointer-events:none;
  background-image: radial-gradient(circle, rgba(var(--shadow-color),.06) 1.6px, transparent 1.6px);
  background-size:26px 26px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, black 40%, transparent 90%);
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, black 40%, transparent 90%);
}
.blob{ position:absolute; z-index:0; border-radius:50%; filter:blur(60px); opacity:.35; }
.blob.b1{ width:340px;height:340px; background:var(--accent); top:-60px; left:-80px; }
.blob.b2{ width:300px;height:300px; background:var(--secondary); bottom:-60px; right:-60px; opacity:.25; }
.bg-fade{
  position:absolute; inset:0; z-index:0; pointer-events:none;
  background:linear-gradient(to bottom, var(--bg) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 78%, var(--bg) 100%);
}

.theme-toggle{
  position:fixed; top:22px; right:22px; z-index:10;
  width:46px;height:46px;border-radius:50%;
  border:var(--border-w) solid var(--border); background:var(--card);
  display:flex;align-items:center;justify-content:center;
  box-shadow:4px 4px 0 rgba(var(--shadow-color),.16);
  transition:transform .3s var(--ease), box-shadow .3s var(--ease);
}
.theme-toggle:hover{ transform:rotate(20deg) translateY(-2px); }
.theme-toggle svg{ width:19px;height:19px; }
.icon-sun{ display:none; }
html.dark .icon-moon{ display:none; }
html.dark .icon-sun{ display:block; }

.wrap{ position:relative; z-index:1; text-align:center; padding:24px; }

.badge{
  display:inline-flex; align-items:center; gap:9px;
  padding:9px 18px; border-radius:100px; border:var(--border-w) solid var(--border);
  background:var(--card); font-size:.8rem; font-weight:600; margin-bottom:34px;
  box-shadow:4px 4px 0 rgba(var(--shadow-color),.16);
  opacity:0; transform:translateY(14px); animation:reveal .7s var(--ease) .1s forwards;
}
.badge .dot{ width:8px;height:8px;border-radius:50%; background:var(--secondary); animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }

.gear-stage{
  width:110px; height:110px; margin:0 auto 20px;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transform:translateY(14px); animation:reveal .7s var(--ease) .16s forwards;
}
.gear-stage svg{
  width:88px; height:88px; color:var(--primary);
  filter:drop-shadow(5px 8px 0 rgba(var(--shadow-color),.16));
  animation:spin 7s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

h1{
  font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:-.02em;
  font-size:clamp(2.6rem, 9vw, 5.2rem); line-height:1; margin:0 0 16px;
  opacity:0; transform:translateY(18px); animation:reveal .7s var(--ease) .26s forwards;
}
h1 span{ color:var(--secondary); }

.subtitle{
  font-family:'Space Grotesk', sans-serif; font-weight:600;
  font-size:clamp(1.05rem, 3vw, 1.4rem); color:var(--text-soft);
  margin:0 0 30px;
  opacity:0; transform:translateY(18px); animation:reveal .7s var(--ease) .38s forwards;
}

.bar{
  width:220px; height:14px; margin:0 auto; border-radius:100px;
  border:var(--border-w) solid var(--border); background:var(--card); overflow:hidden;
  box-shadow:4px 4px 0 rgba(var(--shadow-color),.16);
  opacity:0; transform:translateY(18px); animation:reveal .7s var(--ease) .5s forwards;
}
.bar-fill{
  height:100%; width:40%; border-radius:100px;
  background:linear-gradient(90deg, var(--secondary), var(--accent));
  animation:loading 1.8s ease-in-out infinite;
}
@keyframes loading{
  0%{ width:10%; margin-left:0; }
  50%{ width:55%; margin-left:20%; }
  100%{ width:10%; margin-left:100%; }
}

@keyframes reveal{ to{ opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
  <div class="bg-dots"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="bg-fade"></div>

  <button class="theme-toggle" id="themeToggle" aria-label="Ganti mode terang/gelap">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <div class="wrap">
    <div class="badge"><span class="dot"></span> MAINTENANCE</div>

    <div class="gear-stage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>
        <path d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.3-2.9a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13z"/>
      </svg>
    </div>

    <h1>MAINTENANCE<span>.</span></h1>
    <p class="subtitle">Masih Dibikin dulu 🗿</p>

    <div class="bar"><div class="bar-fill"></div></div>
  </div>

<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const saved = localStorage.getItem('tedy-theme');
  if(saved === 'dark'){ root.classList.add('dark'); }
  else if(saved === 'light'){ root.classList.remove('dark'); }
  else if(window.matchMedia('(prefers-color-scheme: dark)').matches){ root.classList.add('dark'); }

  themeToggle.addEventListener('click', () => {
    root.classList.toggle('dark');
    localStorage.setItem('tedy-theme', root.classList.contains('dark') ? 'dark' : 'light');
  });
</script>
</body>
</html>
